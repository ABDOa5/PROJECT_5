<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do List</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Main Title -->
        <h1 class="main-title">
            Welcome To Our ToDo List AbdoAlrahman AboAlsoud
        </h1>


        <!-- Add Task Card -->
        <div class="task-input-card">

            <label for="taskInput">
                Enter New Task
            </label>

            <input
                type="text"
                id="taskInput"
                class="form-control"
                placeholder="Enter New Task"
            >

            <button
                id="addTaskBtn"
                class="btn add-btn"
            >
                Button
            </button>

        </div>


        <!-- Tasks Counter -->
        <h2 class="tasks-title">
            You Have <span id="taskCount">0</span> Tasks
        </h2>


        <!-- Tasks Container -->
        <div class="tasks-card">

            <div id="emptyMessage" class="empty-message">
                No Tasks Added Yet
            </div>

            <div id="tasksContainer"></div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
